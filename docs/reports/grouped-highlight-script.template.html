<script>
const bench=__BENCHMARK__;
const modelNames={'openai/gpt-oss-120b':'GPT-OSS 120B','openai/gpt-oss-20b':'GPT-OSS 20B','qwen/qwen3.8-27b':'Qwen 3.8 27B'};
const phaseNames={screen:'Round 1', 'screen-r2':'Round 2',minimal:'Minimal contract',medium:'More reasoning',inventory:'Inventory first', 'inventory-r2':'Inventory revision', 'inventory-r3':'Inventory shape fix',repeat:'Repeated Pitzer',holdout:'Oct 5 holdout'};
const phases=[...new Set(bench.cases.map(c=>c.phase))];
let benchPhase=phases.includes('repeat')?'repeat':phases.includes('minimal')?'minimal':phases.includes('screen-r2')?'screen-r2':phases[0];
document.getElementById('bench-scope').textContent=`${bench.outboundCalls} recorded outbound calls across ${phases.length} rounds. Choose a round, then inspect the actual selections or rejection.`;
document.getElementById('bench-phases').innerHTML=phases.map(p=>`<button class="tab" data-phase="${escape(p)}">${escape(phaseNames[p]||p)}</button>`).join('');
function drawBenchCase(){const cases=bench.cases.filter(c=>c.phase===benchPhase),c=cases[Number(document.getElementById('bench-case').value)];if(!c)return;document.getElementById('bench-title').textContent=`${names[c.hall]} · ${c.date}`;const check=c.pitzerChecks?`<p class="bench-case-note">User Pitzer target: ${c.pitzerChecks.filter(x=>x.found).length}/4. ${c.pitzerChecks.filter(x=>!x.found).map(x=>'Missing '+escape(x.label)).join(' · ')}</p>`:'';document.getElementById('bench-items').innerHTML=c.valid?`<p class="bench-case-note">${escape(modelNames[c.model])} · ${escape(c.strategy)} · ${c.wallMs} ms · ${c.usage?.total_tokens??'unreported'} tokens. ${c.foodReviewed?"Source-based food review is shown below; its labels remain assistant judgments.":"Validation passes; this exploratory round has no complete per-pick food review."}</p>${check}`+c.meals.map(m=>`<section class="bench-meal"><h4>${escape(m.name)}</h4>${m.checks?.some(x=>!x.found)?`<p class="bench-missing">Provisional coverage misses: ${m.checks.filter(x=>!x.found).map(x=>escape(x.label)).join(' · ')}</p>`:''}${m.groups.length?m.groups.map(g=>`<article class="item ${g.foodVerdict==='wrong'?'wrong':g.foodVerdict==='weak'?'weak':''}"><div class="item-top"><div class="item-name">${escape(g.title)}</div>${g.foodVerdict?`<span class="badge ${g.foodVerdict==='unflagged'?'correct':g.foodVerdict}">${g.foodVerdict==='wrong'?'Clear error':g.foodVerdict==='weak'?'Weak / duplicate':'No issue flagged'}</span>`:''}</div>${g.foodReasons?.map(reason=>`<p class="reason">${escape(reason)}</p>`).join('')??''}<div class="meta">${escape(g.kind)} · ${escape(g.sourceIds.join(', '))}</div><details class="bench-source"><summary>Original source items${g.componentItems.length?' and '+g.componentItems.length+' linked components':''}</summary><ul>${[...g.sourceItems,...g.componentItems].map(i=>`<li>${escape(i.name)} <small>${escape(i.id)}</small>${i.description?`<p>${escape(i.description)}</p>`:''}</li>`).join('')}</ul></details></article>`).join(''):'<p class="empty">No offerings selected for this service.</p>'}</section>`).join(''):`<div class="bench-fail"><strong>${c.quotaError?"Not tested: provider quota":"Response rejected"}</strong><p>${escape(c.error)}</p><p>${c.quotaError?"This quota rejection is excluded from food quality and coverage scores.":"This rejected output contributes zero usable coverage. It is not an empty menu."}</p></div>`;}
function drawBenchPhase(p){benchPhase=p;document.querySelectorAll('[data-phase]').forEach(b=>{b.classList.toggle('active',b.dataset.phase===p);b.setAttribute('aria-pressed',String(b.dataset.phase===p))});document.getElementById('bench-rows').innerHTML=bench.summaries.filter(s=>s.phase===p).map(s=>`<tr><td>${escape(modelNames[s.model])}<small>${escape(s.strategy)}</small></td><td>${s.attempts-s.quotaErrors?`${s.valid} / ${s.attempts-s.quotaErrors}`:"Not tested"}${s.quotaErrors?`<small>${s.quotaErrors} quota rejection</small>`:""}${s.skipped?`<small>${s.skipped} skipped${s.skipReason?" · "+escape(s.skipReason):""}</small>`:""}</td><td>${s.criticalTotal?`${s.criticalHit} / ${s.criticalTotal}`:"Not assessed"}<small>${s.validCriticalTotal?`${s.criticalHit} / ${s.validCriticalTotal} on valid responses`:"No valid response to assess"}</small></td><td>${s.pitzerTotal?`${s.pitzerHit} / ${s.pitzerTotal}`:'Not assessed'}</td><td>${s.tokens.toLocaleString()}</td></tr>`).join('');const cases=bench.cases.filter(c=>c.phase===p),select=document.getElementById('bench-case');select.innerHTML=cases.map((c,i)=>`<option value="${i}">${escape(names[c.hall])} · ${escape(modelNames[c.model])} · ${escape(c.strategy)}${c.repeat?' · '+c.repeat:''}${c.valid?'':' · rejected'}</option>`).join('');const preferred=cases.findIndex(c=>c.hall==='mcconnell'&&c.model==='openai/gpt-oss-120b'&&c.valid);select.value=String(Math.max(0,preferred));drawBenchCase();}
document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>drawBenchPhase(b.dataset.phase)));document.getElementById('bench-case').addEventListener('change',drawBenchCase);if(benchPhase)drawBenchPhase(benchPhase);
</script>
